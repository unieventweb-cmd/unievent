<!DOCTYPE html>
<html lang="en" dir="ltr" id="main-html">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browse Events — UniEvents Pakistan</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap');
    :root{ --navy:#0F172A; --blue:#2563EB; --blue-deep:#1D4ED8; --gold:#B4870F; --gold-soft:#F6EBCF; --paper:#FFFDF7; --bg:#F8FAFC; --line:#E2E8F0; }
    body{ font-family:'Plus Jakarta Sans', sans-serif; background:var(--bg); }
    .urdu-font, .urdu-font *{ font-family:'Noto Nastaliq Urdu', serif !important; line-height:2.1; }
    .mono{ font-family:'IBM Plex Mono', monospace; }
    .lang-transition{ transition:all .25s ease-in-out; }
    .ticket{ background:var(--paper); border:1px solid var(--line); border-radius:18px; position:relative; overflow:hidden; box-shadow:0 1px 2px rgba(15,23,42,0.04); transition:transform .2s ease, box-shadow .2s ease; }
    .ticket:hover{ transform:translateY(-4px); box-shadow:0 16px 30px -12px rgba(15,23,42,0.18); }
    .ticket-stub{ position:relative; border-top:2px dashed var(--line); }
    .ticket-stub::before, .ticket-stub::after{ content:""; position:absolute; top:-10px; width:20px; height:20px; background:var(--bg); border-radius:50%; }
    .ticket-stub::before{ left:-10px; } .ticket-stub::after{ right:-10px; }
    [dir="rtl"] .ticket-stub::before{ left:auto; right:-10px; }
    [dir="rtl"] .ticket-stub::after{ right:auto; left:-10px; }
    .datebadge{ display:inline-flex; flex-direction:column; align-items:center; justify-content:center; width:52px; height:56px; background:var(--navy); border-radius:10px; color:white; flex-shrink:0; }
    .chip{ border:1px solid var(--line); background:white; color:var(--navy); transition:all .15s ease; cursor:pointer; }
    .chip.active, .chip:hover{ background:var(--navy); color:white; border-color:var(--navy); }
    .filter-group summary{ cursor:pointer; list-style:none; }
    .filter-group summary::-webkit-details-marker{ display:none; }
    .radio-row{ cursor:pointer; }
</style>
</head>
<body class="text-slate-800 antialiased lang-transition">

<header class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-200/80 px-6 py-4 flex justify-between items-center max-w-7xl mx-auto rounded-b-xl shadow-sm">
    <div class="text-2xl font-extrabold text-blue-600 tracking-tight" data-i18n="logo">UniEvents PK</div>
    <nav class="hidden md:flex items-center gap-8 font-medium text-slate-600">
        <a href="../index.html" class="hover:text-blue-600 transition" data-i18n="navHome">Home</a>
        <a href="events.html" class="text-blue-600 transition" data-i18n="navBrowse">Browse Events</a>
        <a href="../index.html#how" class="hover:text-blue-600 transition" data-i18n="navHow">How It Works</a>
        <a href="about.html" class="hover:text-blue-600 transition" data-i18n="navAbout">About</a>
    </nav>
    <div class="flex items-center gap-3">
        <select id="lang-switcher" class="border border-slate-300 rounded-lg px-3 py-1.5 text-sm bg-white font-medium text-slate-700 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 cursor-pointer" onchange="switchLanguage(this.value)">
            <option value="en">English</option>
            <option value="ur">اردو</option>
        </select>
    </div>
</header>

<!-- Page header + search -->
<section class="max-w-6xl mx-auto px-4 pt-14 pb-8 text-center">
    <h1 class="text-3xl md:text-4xl font-black text-slate-900 mb-3" data-i18n="pageTitle">Browse Campus Events</h1>
    <p class="text-slate-500 max-w-xl mx-auto mb-8" data-i18n="pageDesc">Search by name, university, or city to find events happening near you.</p>
    <div class="max-w-xl mx-auto relative">
        <input id="search-input" type="text" data-i18n-placeholder="searchPlaceholder" placeholder="Search events, universities, cities..."
            class="w-full border border-slate-200 rounded-xl px-5 py-3.5 pl-12 shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500">
        <svg class="w-5 h-5 text-slate-400 absolute left-4 top-1/2 -translate-y-1/2" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-5.2-5.2m0 0A7.5 7.5 0 1 0 5.3 5.3a7.5 7.5 0 0 0 10.5 10.5Z"/></svg>
    </div>
</section>

<!-- Main content: filters + grid -->
<section class="max-w-6xl mx-auto px-4 pb-24 grid grid-cols-1 lg:grid-cols-[240px_1fr] gap-10">

    <!-- Filters sidebar -->
    <aside class="space-y-6">
        <div class="filter-group">
            <div class="font-semibold text-sm text-slate-900 mb-3" data-i18n="filterCategory">Category</div>
            <div class="flex flex-wrap gap-2" id="category-filters">
                <button class="chip active px-3 py-1.5 rounded-full text-xs font-medium" data-cat="all" data-i18n="catAll">All</button>
                <button class="chip px-3 py-1.5 rounded-full text-xs font-medium" data-cat="Tech Fest" data-i18n="catTech">Tech Fests</button>
                <button class="chip px-3 py-1.5 rounded-full text-xs font-medium" data-cat="Sports Gala" data-i18n="catSports">Sports Galas</button>
                <button class="chip px-3 py-1.5 rounded-full text-xs font-medium" data-cat="Cultural" data-i18n="catCultural">Cultural</button>
                <button class="chip px-3 py-1.5 rounded-full text-xs font-medium" data-cat="Academic" data-i18n="catAcademic">Academic</button>
                <button class="chip px-3 py-1.5 rounded-full text-xs font-medium" data-cat="Business" data-i18n="catBusiness">Business</button>
            </div>
        </div>
        <div class="filter-group border-t border-slate-200 pt-6">
            <div class="font-semibold text-sm text-slate-900 mb-3" data-i18n="filterCity">City</div>
            <div class="space-y-2 text-sm text-slate-600" id="city-filters">
                <label class="radio-row flex items-center gap-2"><input type="radio" name="city" value="all" checked class="accent-blue-600"><span data-i18n="cityAll">All Cities</span></label>
                <label class="radio-row flex items-center gap-2"><input type="radio" name="city" value="Lahore" class="accent-blue-600"><span>Lahore</span></label>
                <label class="radio-row flex items-center gap-2"><input type="radio" name="city" value="Islamabad" class="accent-blue-600"><span>Islamabad</span></label>
                <label class="radio-row flex items-center gap-2"><input type="radio" name="city" value="Karachi" class="accent-blue-600"><span>Karachi</span></label>
            </div>
        </div>
        <div class="filter-group border-t border-slate-200 pt-6">
            <div class="font-semibold text-sm text-slate-900 mb-3" data-i18n="filterPrice">Entry</div>
            <div class="space-y-2 text-sm text-slate-600">
                <label class="radio-row flex items-center gap-2"><input type="radio" name="price" value="all" checked class="accent-blue-600"><span data-i18n="priceAll">Any</span></label>
                <label class="radio-row flex items-center gap-2"><input type="radio" name="price" value="free" class="accent-blue-600"><span data-i18n="priceFree">Free Entry</span></label>
                <label class="radio-row flex items-center gap-2"><input type="radio" name="price" value="paid" class="accent-blue-600"><span data-i18n="pricePaid">Paid</span></label>
            </div>
        </div>
    </aside>

    <!-- Results -->
    <div>
        <div class="flex items-center justify-between mb-5">
            <p class="text-sm text-slate-500"><span id="result-count" class="font-semibold text-slate-900 mono">0</span> <span data-i18n="resultsFound">events found</span></p>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="events-grid"></div>
        <p id="no-results" class="hidden text-center text-slate-400 py-16" data-i18n="noResults">No events match your filters. Try clearing a filter.</p>
    </div>
</section>

<footer class="border-t border-slate-200/80 bg-white">
    <div class="max-w-6xl mx-auto px-4 py-10 text-center text-xs text-slate-400" data-i18n="footerRights">© 2026 UniEvents PK. All rights reserved.</div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../main.js"></script>
<script>
    const translations = {
        en:{
            logo:"UniEvents PK", navHome:"Home", navBrowse:"Browse Events", navHow:"How It Works", navAbout:"About",
            pageTitle:"Browse Campus Events", pageDesc:"Search by name, university, or city to find events happening near you.",
            searchPlaceholder:"Search events, universities, cities...",
            filterCategory:"Category", catAll:"All", catTech:"Tech Fests", catSports:"Sports Galas", catCultural:"Cultural", catAcademic:"Academic", catBusiness:"Business",
            filterCity:"City", cityAll:"All Cities",
            filterPrice:"Entry", priceAll:"Any", priceFree:"Free Entry", pricePaid:"Paid",
            resultsFound:"events found", noResults:"No events match your filters. Try clearing a filter.",
            footerRights:"© 2026 UniEvents PK. All rights reserved to MSUKASHA SMC-PRIVATE LIMITED.", dir:"ltr",
            events:[
                {day:"14",mon:"AUG",cat:"Tech Fest",title:"LUMS Tech Fusion 2026",venue:"LUMS, Lahore",city:"Lahore",tag:"Free Entry",price:"free"},
                {day:"22",mon:"AUG",cat:"Sports Gala",title:"NUST Inter-University Games",venue:"NUST, Islamabad",city:"Islamabad",tag:"Rs. 500",price:"paid"},
                {day:"03",mon:"SEP",cat:"Academic",title:"IBA Business Case Summit",venue:"IBA, Karachi",city:"Karachi",tag:"Free Entry",price:"free"},
                {day:"10",mon:"SEP",cat:"Cultural",title:"FAST Mehfil-e-Rang",venue:"FAST-NUCES, Lahore",city:"Lahore",tag:"Rs. 300",price:"paid"},
                {day:"18",mon:"SEP",cat:"Tech Fest",title:"COMSATS AI Hackathon",venue:"COMSATS, Islamabad",city:"Islamabad",tag:"Free Entry",price:"free"},
                {day:"27",mon:"SEP",cat:"Business",title:"UoK Entrepreneurship Expo",venue:"University of Karachi",city:"Karachi",tag:"Free Entry",price:"free"},
                {day:"05",mon:"OCT",cat:"Sports Gala",title:"PU Athletics Championship",venue:"Punjab University, Lahore",city:"Lahore",tag:"Rs. 200",price:"paid"},
                {day:"12",mon:"OCT",cat:"Academic",title:"GIKI Research Symposium",venue:"GIKI, Topi",city:"Islamabad",tag:"Free Entry",price:"free"}
            ]
        },
        ur:{
            logo:"یونی ایونٹس PK", navHome:"ہوم", navBrowse:"ایونٹس دیکھیں", navHow:"طریقہ کار", navAbout:"ہمارے بارے میں",
            pageTitle:"کیمپس ایونٹس براؤز کریں", pageDesc:"نام، یونیورسٹی یا شہر کے ذریعے اپنے قریب ہونے والے ایونٹس تلاش کریں۔",
            searchPlaceholder:"ایونٹس، یونیورسٹیز، شہر تلاش کریں...",
            filterCategory:"کیٹیگری", catAll:"تمام", catTech:"ٹیک فیسٹ", catSports:"اسپورٹس گالا", catCultural:"ثقافتی", catAcademic:"تعلیمی", catBusiness:"بزنس",
            filterCity:"شہر", cityAll:"تمام شہر",
            filterPrice:"انٹری", priceAll:"کوئی بھی", priceFree:"مفت انٹری", pricePaid:"ادائیگی",
            resultsFound:"ایونٹس ملے", noResults:"آپ کے فلٹرز سے کوئی ایونٹ نہیں ملا۔ فلٹر ہٹا کر دیکھیں۔",
            footerRights:"© 2026 UniEvents PK۔ جملہ حقوق MSUKASHA SMC-PRIVATE LIMITED کے نام محفوظ ہیں۔", dir:"rtl",
            events:[
                {day:"14",mon:"اگست",cat:"ٹیک فیسٹ",title:"LUMS ٹیک فیوژن 2026",venue:"LUMS، لاہور",city:"Lahore",tag:"مفت انٹری",price:"free"},
                {day:"22",mon:"اگست",cat:"اسپورٹس گالا",title:"NUST انٹر یونیورسٹی گیمز",venue:"NUST، اسلام آباد",city:"Islamabad",tag:"روپے 500",price:"paid"},
                {day:"03",mon:"ستمبر",cat:"تعلیمی",title:"IBA بزنس کیس سمٹ",venue:"IBA، کراچی",city:"Karachi",tag:"مفت انٹری",price:"free"},
                {day:"10",mon:"ستمبر",cat:"ثقافتی",title:"FAST محفلِ رنگ",venue:"FAST-NUCES، لاہور",city:"Lahore",tag:"روپے 300",price:"paid"},
                {day:"18",mon:"ستمبر",cat:"ٹیک فیسٹ",title:"COMSATS AI ہیکاتھون",venue:"COMSATS، اسلام آباد",city:"Islamabad",tag:"مفت انٹری",price:"free"},
                {day:"27",mon:"ستمبر",cat:"بزنس",title:"UoK انٹرپرینیورشپ ایکسپو",venue:"جامعہ کراچی",city:"Karachi",tag:"مفت انٹری",price:"free"},
                {day:"05",mon:"اکتوبر",cat:"اسپورٹس گالا",title:"PU ایتھلیٹکس چیمپیئن شپ",venue:"پنجاب یونیورسٹی، لاہور",city:"Lahore",tag:"روپے 200",price:"paid"},
                {day:"12",mon:"اکتوبر",cat:"تعلیمی",title:"GIKI ریسرچ سمپوزیم",venue:"GIKI، ٹوپی",city:"Islamabad",tag:"مفت انٹری",price:"free"}
            ]
        }
    };

    let currentLang = 'en';
    let activeCat = 'all', activeCity = 'all', activePrice = 'all', searchTerm = '';
    let backendEvents = [];

    function renderEvents(){
        const grid = document.getElementById('events-grid');
        grid.innerHTML = "";
        const filtered = backendEvents.filter(ev => {
            const matchCat = activeCat === 'all' || ev.category === activeCat;
            const matchCity = activeCity === 'all' || ev.city === activeCity;
            const matchPrice = activePrice === 'all' || (ev.is_free ? 'free' : 'paid') === activePrice;
            const matchSearch = searchTerm === '' || `${ev.title} ${ev.venue} ${ev.organization_name}`.toLowerCase().includes(searchTerm.toLowerCase());
            return matchCat && matchCity && matchPrice && matchSearch;
        });
        document.getElementById('result-count').innerText = filtered.length;
        document.getElementById('no-results').classList.toggle('hidden', filtered.length !== 0);

        filtered.forEach(ev => {
            const card = document.createElement('a');
            card.href = `event-detail.html?id=${encodeURIComponent(ev.id)}`;
            card.className = "ticket flex flex-col";
            const header = document.createElement('div');
            header.className = 'p-5 flex gap-4 items-start';
            const dateBadge = document.createElement('div');
            dateBadge.className = 'datebadge';
            const eventDate = new Date(`${ev.event_date}T00:00:00`);
            const day = document.createElement('span');
            day.className = 'mono text-lg font-semibold leading-none';
            day.textContent = new Intl.DateTimeFormat('en', { day: '2-digit' }).format(eventDate);
            const month = document.createElement('span');
            month.className = 'mono text-[10px] tracking-wide mt-0.5';
            month.textContent = new Intl.DateTimeFormat(currentLang, { month: 'short' }).format(eventDate);
            dateBadge.append(day, month);
            const details = document.createElement('div');
            details.className = 'min-w-0';
            const category = document.createElement('div');
            category.className = 'text-xs font-semibold text-blue-600 mb-1';
            category.textContent = ev.category;
            const title = document.createElement('h3');
            title.className = 'font-bold text-slate-900 leading-snug';
            title.textContent = ev.title;
            const venue = document.createElement('p');
            venue.className = 'text-sm text-slate-500 mt-1';
            venue.textContent = ev.venue;
            details.append(category, title, venue);
            header.append(dateBadge, details);
            const stub = document.createElement('div');
            stub.className = 'ticket-stub px-5 py-3 flex items-center justify-between';
            const code = document.createElement('span');
            code.className = 'mono text-xs text-slate-400';
            code.textContent = ev.event_code || `#UEP-${day.textContent}${month.textContent.toUpperCase()}`;
            const price = document.createElement('span');
            price.className = 'text-xs font-semibold bg-amber-50 text-amber-700 px-2.5 py-1 rounded-full';
            const cheapestTier = (ev.ticket_tiers || []).reduce((lowest, tier) => Math.min(lowest, tier.price_pkr), Infinity);
            price.textContent = ev.is_free ? 'Free Entry' : `Rs. ${Number.isFinite(cheapestTier) ? cheapestTier.toLocaleString() : 'Paid'}`;
            stub.append(code, price);
            card.append(header, stub);
            grid.appendChild(card);
        });
    }

    function switchLanguage(lang){
        currentLang = lang;
        const htmlTag = document.getElementById('main-html');
        const data = translations[lang];
        document.querySelectorAll('[data-i18n]').forEach(el => { if(data[el.getAttribute('data-i18n')] !== undefined) el.innerText = data[el.getAttribute('data-i18n')]; });
        document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { const k = el.getAttribute('data-i18n-placeholder'); if(data[k]!==undefined) el.setAttribute('placeholder', data[k]); });
        htmlTag.setAttribute('dir', data.dir);
        document.body.classList.toggle('urdu-font', lang === 'ur');
        document.querySelector('nav').classList.toggle('flex-row-reverse', lang === 'ur');
        renderEvents();
    }

    document.getElementById('category-filters').addEventListener('click', e => {
        if(e.target.dataset.cat){
            document.querySelectorAll('#category-filters .chip').forEach(c => c.classList.remove('active'));
            e.target.classList.add('active');
            activeCat = e.target.dataset.cat;
            renderEvents();
        }
    });
    document.getElementById('city-filters').addEventListener('change', e => { activeCity = e.target.value; renderEvents(); });
    document.querySelectorAll('input[name="price"]').forEach(r => r.addEventListener('change', e => { activePrice = e.target.value; renderEvents(); }));
    document.getElementById('search-input').addEventListener('input', e => { searchTerm = e.target.value; renderEvents(); });

    document.getElementById('no-results').textContent = 'Loading events...';
    document.getElementById('no-results').classList.remove('hidden');
    document.getElementById('result-count').textContent = '0';
    if (window.UniAPI) {
        window.UniAPI.listEvents().then(events => {
            backendEvents = events;
            document.getElementById('no-results').textContent = translations[currentLang].noResults;
            renderEvents();
        }).catch(error => {
            document.getElementById('no-results').textContent = `Could not load events: ${error.message}`;
        });
    } else {
        document.getElementById('no-results').textContent = 'Backend is not configured. Set the Supabase URL and anon key in Backend/js/config.js.';
    }
</script>
</body>
</html>

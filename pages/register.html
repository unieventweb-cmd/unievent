<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — UniEvents Pakistan</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body{ font-family:'Plus Jakarta Sans', sans-serif; }
</style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
<header class="bg-white/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-200/80 px-6 py-4">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
        <a href="../index.html" class="text-2xl font-extrabold text-blue-600 tracking-tight">UniEvents PK</a>
        <nav class="flex items-center gap-4 text-sm font-medium text-slate-600">
            <a href="../index.html" class="hover:text-blue-600 transition">Home</a>
            <a href="login.html" class="hover:text-blue-600 transition">Login</a>
        </nav>
    </div>
</header>

<main class="max-w-6xl mx-auto px-4 py-16">
    <div class="grid md:grid-cols-2 gap-10 items-center">
        <div>
            <p class="text-sm font-semibold uppercase tracking-[0.2em] text-blue-600 mb-3">New account</p>
            <h1 class="text-4xl md:text-5xl font-black text-slate-900 mb-4">Create your UniEvents account</h1>
            <p class="text-lg text-slate-600 leading-relaxed">Join thousands of students who use UniEvents to discover campus events and book tickets faster.</p>
        </div>

        <div class="bg-white border border-slate-200 rounded-3xl shadow-xl p-8">
            <h2 class="text-2xl font-bold text-slate-900 mb-2">Register</h2>
            <p class="text-sm text-slate-500 mb-6">Create your account in seconds</p>

            <form id="register-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2" for="name">Full name</label>
                    <input id="name" type="text" placeholder="Your full name" class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2" for="email">Email address</label>
                    <input id="email" type="email" placeholder="you@example.com" class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-2" for="password">Password</label>
                    <input id="password" type="password" placeholder="Create a password" class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500">
                </div>
                <button type="submit" class="w-full rounded-xl bg-blue-600 px-4 py-3 font-semibold text-white shadow-sm hover:bg-blue-700 transition">Create account</button>
            </form>

            <p class="text-sm text-slate-500 mt-6 text-center">
                Already have an account?
                <a href="login.html" class="font-semibold text-blue-600 hover:underline">Login</a>
            </p>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../main.js"></script>
</body>
</html>
